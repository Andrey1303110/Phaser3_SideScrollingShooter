<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="./favicon.ico?v=2">
    <link rel="apple-touch-icon" sizes="57x57" href="./assets/icons/apple-icon-57x57.png?v=2">
    <link rel="apple-touch-icon" sizes="60x60" href="./assets/icons/apple-icon-60x60.png?v=2">
    <link rel="apple-touch-icon" sizes="72x72" href="./assets/icons/apple-icon-72x72.png?v=2">
    <link rel="apple-touch-icon" sizes="76x76" href="./assets/icons/apple-icon-76x76.png?v=2">
    <link rel="apple-touch-icon" sizes="114x114" href="./assets/icons/apple-icon-114x114.png?v=2">
    <link rel="apple-touch-icon" sizes="120x120" href="./assets/icons/apple-icon-120x120.png?v=2">
    <link rel="apple-touch-icon" sizes="144x144" href="./assets/icons/apple-icon-144x144.png?v=2">
    <link rel="apple-touch-icon" sizes="152x152" href="./assets/icons/apple-icon-152x152.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-icon-180x180.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/android-icon-192x192.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="96x96" href="./assets/icons/favicon-96x96.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png?v=2">
    <meta name="msapplication-config" content="./browserconfig.xml">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="./assets/icons/ms-icon-144x144.png?v=2">
    <meta name="theme-color" content="#ffffff">
    <title>Game</title>
    <style>
        body {
            background: #000000;
            padding: 0px;
            margin: 0px;
        }

        @font-face {
            font-family: 'DishOut';
            src: url("./assets/fonts/DishOut/DishOut.otf") format("opentype"),
                url("./assets/fonts/DishOut/DishOut.ttf") format("opentype");
        }

        @font-face {
            font-family: 'Pangolin';
            src: url("./assets/fonts/Pangolin/Pangolin-Regular.otf") format("opentype"),
                url("./assets/fonts/Pangolin/Pangolin-Regular.ttf") format("opentype");
        }

        #rotate-device { display: none; }
        @media (orientation: portrait) {
            #rotate-device {
                position: fixed; inset: 0; z-index: 10; display: grid; place-content: center;
                justify-items: center; gap: 24px; background: #102727; color: #f3eddd;
                text-align: center; font: bold clamp(18px, 5vw, 28px) Arial, sans-serif;
            }
            #gameDiv { visibility: hidden; }
        }
        .phone-turn {
            width: 40px; height: 72px; border: 4px solid #e4c284; border-radius: 9px;
            position: relative; margin: 22px; transform: rotate(90deg);
            animation: rotate-phone 2.4s ease-in-out infinite;
        }
        .phone-turn::after {
            content: ''; position: absolute; bottom: 5px; left: 40%; width: 20%;
            height: 3px; background: #e4c284; border-radius: 2px;
        }
        @keyframes rotate-phone {
            0%, 18% { transform: rotate(0deg); } 70%, 100% { transform: rotate(90deg); }
        }
        @media (prefers-reduced-motion: reduce) { .phone-turn { animation: none; } }

        .font {
            position: absolute;
            left: -100vw;
            top: -100vw;
            visibility: hidden;
        }

        .font1 {
            font-family: 'DishOut';
        }

        .font2 {
            font-family: 'Pangolin';
        }
    </style>
</head>

<body>
    <div class="font font1">.</div>
    <div class="font font2">.</div>
    <div id="gameDiv"></div>
    <div id="rotate-device" role="status">
        <span class="phone-turn" aria-hidden="true"></span>
        <span>Поверни пристрій горизонтально<br>Rotate your device</span>
    </div>
</body>

</html>
